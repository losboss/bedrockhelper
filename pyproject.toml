[tool.poetry]
name = "bedrockhelper"
version = "1.2.0"
description = "Helper utilities for Amazon Bedrock (RAG, embeddings, batch jobs)"
authors = ["Matthew Marion <matthew@endofline.ca>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "bedrockhelper", from = "src" }]
include = ["README.md", "LICENSE*"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
boto3 = "^1.43.72"
botocore = { extras = ["crt"], version = "^1.43.72" }
boto3-stubs = "^1.43.72"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.0.0"
mypy = "^2.3.1"
ruff = "^0.16.3"
pre-commit = "^4.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Ruff is configured in ruff.toml, which takes precedence over pyproject.toml.
# Do not add [tool.ruff] here - it would be silently ignored.

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
packages = ["bedrockhelper"]
strict = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
exclude = "(^dist/|^build/|^\\.venv/)"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
