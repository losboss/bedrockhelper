# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# Must match the minimum supported Python in pyproject.toml.
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    'E401', # multiple imports on one line
    'E402', # module level import not at top of file
    #    'E501', # line too long (82 > 79 characters)
    'F403', # 'from module import *' used; unable to detect undefined names
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
quote-style = "single"
indent-style = "tab"
skip-magic-trailing-comma = false

line-ending = "lf"

docstring-code-format = true
docstring-code-line-length = "dynamic"

# ruff 0.16+ formats Python inside Markdown. Docs target external readers, so
# they keep conventional 4-space/double-quote style rather than house style.
exclude = ["*.md"]
